<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドキュメントのタイトル</title>

<!-- === スタイル ===================================================== -->
<!-- 分離配置で使う場合（推奨）: -->
<link rel="stylesheet" href="assets/doc.css">
<!-- 単一ファイルにしたい場合は上の行を消し、doc.css の中身を <style> に貼る -->

<!-- === 設定（任意・doc.js より前に置く） ============================ -->
<!--
<script>
  window.DOC_CONFIG = {
    toc:         { enable: true, title: '目次' },
    highlight:   { enable: true },     // シンタックスハイライト（既定 off）
    themeToggle: { enable: true },     // ライト/ダーク切替ボタン（既定 off）
    math:        { engine: 'katex' }   // 'katex' | 'mathjax'
  };
</script>
-->
</head>

<body>
<a class="doc-skip-link" href="#main">本文へスキップ</a>

<div class="doc-layout">

  <!-- 目次（中身は doc.js が生成する。不要なら要素ごと削除） -->
  <aside class="doc-toc" id="doc-toc"></aside>

  <div class="doc-main" id="main">

    <!-- ============ 文書ヘッダ ============ -->
    <header class="doc-header">
      <p class="doc-eyebrow">ドキュメント種別</p>
      <h1>ドキュメントのタイトル</h1>
      <p class="doc-subtitle">1〜2 文で内容を要約するサブタイトル。</p>

      <dl class="doc-meta">
        <div><dt>作成日</dt><dd>2026-09-06</dd></div>
        <div><dt>バージョン</dt><dd>1.0</dd></div>
        <div><dt>作成</dt><dd>担当者名</dd></div>
        <div><dt>ステータス</dt><dd><span class="badge badge-success">確定</span></dd></div>
      </dl>
    </header>

    <!-- ============ 本文 ============
         ここに通常のセマンティック HTML を書く。
         h2 / h3 が目次になる。クラス名を覚える必要はほぼない。 -->
    <article class="doc-body">

      <p class="lead">冒頭の要約（リード文）。この文書が何で、誰に向けたもので、
      読むと何が分かるのかを 2〜3 文で述べる。</p>

      <h2>セクション見出し</h2>
      <p>本文。</p>

      <h3>小見出し</h3>
      <p>本文。</p>

      <!-- 使えるパーツの早見表は example.html を参照 -->

    </article>

    <!-- ============ フッタ ============ -->
    <footer class="doc-footer">
      <p>ドキュメントのタイトル — v1.0</p>
      <p>最終更新: 2026-09-06</p>
    </footer>

  </div>
</div>

<!-- === スクリプト =================================================== -->
<!-- 分離配置で使う場合（推奨）: -->
<script src="assets/doc.js" defer></script>
<!-- 単一ファイルにしたい場合は上の行を消し、doc.js の中身を <script> に貼る -->
</body>
</html>
